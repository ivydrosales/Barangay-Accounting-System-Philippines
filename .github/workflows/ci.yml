name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder

  database:
    name: Database rules
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Seed file is up to date with the CSV
        run: |
          node scripts/gen-seed.mjs
          git diff --exit-code -- supabase/seed.sql
      - name: Migrations, seed and rule tests
        run: bash scripts/db-test.sh postgresql://postgres:postgres@localhost:5432/postgres
